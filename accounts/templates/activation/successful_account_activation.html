{% extends 'base.html' %}

{% load static %}

{% block 'styles_css' %}
    <link rel="stylesheet" href="{% static 'css/activation/success.css' %}">
{% endblock%}

{% block 'content' %}
  <main class="activation-page">
    <div class="activation-aurora" aria-hidden="true"></div>

    <section class="activation-card" aria-labelledby="activation-title">
      <header class="activation-header">
        <div class="activation-check" aria-hidden="true">
          <i class="fa-solid fa-check"></i>
        </div>
        <h1 id="activation-title">Conta ativada com sucesso!</h1>
        <p>Seu cadastro foi confirmado. Agora você pode acessar sua conta e começar a usar.</p>
      </header>

      <div class="activation-actions">
        <a href="{% url 'login' %}" class="btn-primary">
          <i class="fa-solid fa-right-to-bracket" aria-hidden="true"></i>
          Entrar na conta
        </a>
        <a href="../home/index.html" class="link-muted">Ir para a página inicial</a>
      </div>

    </section>
  </main>
{% endblock%}
