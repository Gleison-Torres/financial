{% extends 'base.html' %} <!-- Extende template_base com Navbar e Footer  -->

{% load static %}

{% block 'styles_css' %}
  <link rel="stylesheet" href="{% static 'css/password_reset/password_reset_request.css' %}">
{% endblock%}


{% block 'title' %}
  Redefinir senha
{% endblock %}


{% block 'content' %}

  <main class="recover-page">
    <div class="recover-aurora" aria-hidden="true"></div>

    <section class="recover-card" aria-labelledby="recover-title">
      <header class="recover-header">
        <div class="recover-badge">
          <i class="fa-solid fa-envelope-open-text" aria-hidden="true"></i>
        </div>
        <h1 id="recover-title">Recuperar senha</h1>
        <p>Informe seu e-mail para receber o link de redefinição de senha</p>
      </header>

      <form class="recover-form" id="recover-form" onsubmit="return false;">
        <div class="form-group">
          <label class="field-label" for="recover-email">E-mail</label>
          <div class="field-control">
            <i class="fa-solid fa-envelope field-icon" aria-hidden="true"></i>
            <input
              id="recover-email"
              name="email"
              type="email"
              autocomplete="email"
              placeholder="voce@email.com"
              required
            />
          </div>
        </div>

        <button type="submit" class="btn-primary">Enviar link de redefinição</button>

        <p class="recover-login">
          Lembrou sua senha? <a href="{% url 'login' %}" class="link-accent">Faça login</a>
        </p>
      </form>
    </section>
  </main>


{% endblock %}
